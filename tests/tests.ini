# === 1. ПРОВЕРКА ПЕРЕМЕННЫХ И ИМЕНИ КОМПЬЮТЕРА (Этап 1-2) ===
# Передаем переменные в аргументы ls, чтобы эмулятор раскрыл их и вывел на экран
ls $USER $HOSTNAME

# === 2. РАБОТА С VFS (Этап 3) ===
# Вызов ls без аргументов
ls

# Вызов cd в виртуальную папку
cd /home/user

# === 3. ОБРАБОТКА ОШИБОК (Этап 2-3) ===
# Передаем лишние аргументы в cd.
# Команда выдаст ошибку и прервет скрипт, как требует методичка!
cd папка1 папка2 папка3

# === 4. КОМАНДА ВЫХОДА ===
# Эта строка не выполнится при автотесте, так как скрипт упадет на ошибке cd выше.
# Но ее наличие в файле показывает пример использования всех режимов.
exit
