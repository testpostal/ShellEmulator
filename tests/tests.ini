# 1. Проверка справки
help

# 2. Вывод календаря
cal

# 3. Просмотр корня файловой системы
ls

# 4. Чтение файла readme.txt из памяти
head readme.txt

# 5. Перемещение/переименование файла в памяти VFS
mv readme.txt info.txt

# 6. Проверка, что файл переименовался в памяти
ls

# 7. Чтение файла по новому имени info.txt
head info.txt

# 8. Переход по директориям
cd /

# 9. Намеренная ошибка в аргументах для проверки падения скрипта
cd папка1 папка2 папка3